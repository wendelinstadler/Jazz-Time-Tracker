<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>Jazz Time Tracker</title>
  <link href="popup.css" rel="stylesheet">
  <script defer src="core.js"></script>
  <script defer src="popup.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="../icon128.png" alt="" width="28" height="28"/>
      <h1>Jazz Time Tracker</h1>
    </div>
    <div class="segmented" role="group" data-i18n-aria="language" aria-label="Language">
      <button type="button" data-lang="de" aria-pressed="false">DE</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <!-- Live status -->
  <section class="card live" id="liveCard" aria-live="off">
    <div class="live-body" id="liveBody" hidden>
      <div class="ring" id="ring">
        <svg viewBox="0 0 96 96" aria-hidden="true">
          <circle class="ring-track" cx="48" cy="48" r="40"/>
          <circle class="ring-fill" id="ringFill" cx="48" cy="48" r="40"/>
        </svg>
        <div class="ring-text"><span id="livePercent">0</span><small>%</small></div>
      </div>
      <div class="live-stats">
        <div class="chip" id="liveChip"></div>
        <div class="clockout" id="liveClockOut" role="alert" hidden></div>
        <dl>
          <div><dt data-i18n="timeSpent"></dt><dd id="liveSpent">–</dd></div>
          <div id="liveToGoRow"><dt id="liveToGoLabel"></dt><dd id="liveToGo">–</dd></div>
          <div><dt data-i18n="goHome"></dt><dd id="liveHome">–</dd></div>
        </dl>
      </div>
    </div>
    <div class="live-meta" id="liveMeta" hidden>
      <span><span data-i18n="breakTaken"></span> <strong id="liveBreak">–</strong></span>
      <span id="liveOverWrap"><span data-i18n="overtime"></span> <strong id="liveOver">0:00</strong></span>
      <span id="liveUpdated"></span>
    </div>
    <div class="balances" id="liveBalances" hidden>
      <div class="balance" id="balTimeRow"><div class="balance-value" id="balTime"></div><div class="balance-label" data-i18n="timeBalance"></div><div class="balance-label" id="balTimeSub"></div></div>
      <div class="balance" id="balTodayRow"><div class="balance-value" id="balToday"></div><div class="balance-label" data-i18n="timeBalance"></div><div class="balance-label" data-i18n="balanceToday"></div></div>
      <div class="balance" id="balVacRow"><div class="balance-value" id="balVac"></div><div class="balance-label" data-i18n="vacationBalance"></div><div class="balance-label" id="balVacSub"></div></div>
    </div>
    <div class="live-empty" id="liveEmpty" hidden>
      <strong data-i18n="noDataTitle"></strong>
      <p data-i18n="noDataBody"></p>
    </div>
  </section>

  <!-- Settings -->
  <div class="settings-head">
    <h2 data-i18n="settingsTitle"></h2>
    <div class="status-message" id="statusMessage" role="status"></div>
  </div>

  <section class="card">
    <div class="row">
      <div class="row-text">
        <label class="row-label" for="isApprentice" data-i18n="apprentice"></label>
        <div class="row-desc" data-i18n="apprenticeDesc"></div>
      </div>
      <label class="switch"><input id="isApprentice" type="checkbox"/><span class="slider"></span></label>
    </div>
  </section>

  <h3 data-i18n="sectionAlerts"></h3>
  <section class="card">
    <div class="row">
      <div class="row-text">
        <label class="row-label" for="showWarnings" data-i18n="showWarnings"></label>
        <div class="row-desc" data-i18n="showWarningsDesc"></div>
      </div>
      <label class="switch"><input id="showWarnings" type="checkbox" checked/><span class="slider"></span></label>
    </div>
    <div class="row">
      <div class="row-text">
        <label class="row-label" for="showViolations" data-i18n="showViolations"></label>
        <div class="row-desc" data-i18n="showViolationsDesc"></div>
      </div>
      <label class="switch"><input id="showViolations" type="checkbox" checked/><span class="slider"></span></label>
    </div>
    <div class="row">
      <div class="row-text">
        <label class="row-label" for="notifyEnabled" data-i18n="notifications"></label>
        <div class="row-desc" data-i18n="notificationsDesc"></div>
      </div>
      <label class="switch"><input id="notifyEnabled" type="checkbox" checked/><span class="slider"></span></label>
    </div>
    <div class="row" id="notifyLeadRow">
      <label class="row-label" for="notifyLeadMinutes" data-i18n="notifyLead"></label>
      <select id="notifyLeadMinutes">
        <option value="5"></option>
        <option value="10"></option>
        <option value="15"></option>
        <option value="30"></option>
      </select>
    </div>
  </section>

  <h3 data-i18n="sectionHours"></h3>
  <section class="card">
    <div class="days" id="days"></div>
    <div class="hint" data-i18n="hoursHint"></div>
  </section>

  <div class="spacer"></div>

  <!-- Links and credits -->
  <section class="card about">
    <div class="about-title" data-i18n="rulesTitle"></div>
    <div class="links">
      <a href="https://confluence.coop.ch/x/wbGLFQ" target="_blank" rel="noopener noreferrer" data-i18n="rulesFull"></a>
      <a href="https://confluence.coop.ch/x/v7GLFQ" target="_blank" rel="noopener noreferrer" data-i18n="rulesApprentice"></a>
    </div>
  </section>

  <footer>
    <span><span data-i18n="version"></span> <span id="extVersion">-</span></span>
  </footer>
</body>
</html>
